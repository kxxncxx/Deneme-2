name: APK Derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Proje klasörünü bul
        id: find
        run: |
          f=$(find . -name settings.gradle.kts -not -path '*/node_modules/*' | head -1)
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Debug APK derle
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: HesapMakinesi-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
